[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ree-mcp"
version = "0.1.0"
description = "MCP Server for Red Electrica REData"
authors = [{name = "REE Integration Team"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=0.1.0",
    "pydantic>=2.0",
    "requests>=2.25.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ree-mcp = "ree_mcp.app:main"
