[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server"
version = "0.1.0"
description = "Unified MCP servers for REE, ESIOS, and OMIE energy data"
authors = [{name = "Energy Integration Team"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "pandas>=1.3.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.25.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ree-mcp = "ree_mcp.app:main"
esios-mcp = "esios_mcp.app:main"
omie-mcp = "omie_mcp.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
