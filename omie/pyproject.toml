[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omie-mcp"
version = "0.1.0"
description = "MCP Server for OMIE Energy Market Data"
authors = [{name = "OMIE Integration Team"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=0.1.0",
    "requests>=2.25.1",
    "pandas>=1.3.0",
    "pydantic>=2.0.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
omie-mcp = "omie_mcp.app:main"
